name: Create a co-authored collaboration record

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-collaboration-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a truthful bot-authored collaboration record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c achievement/pair-extraordinaire
          printf '%s\n' \
            '# Collaboration record' \
            '' \
            'This document was generated by GitHub Actions and co-authored with the repository owner.' \
            'It demonstrates transparent commit attribution in a pull-request workflow.' \
            > COLLABORATION.md
          git add COLLABORATION.md
          git commit -m "docs: record automated collaboration" \
            -m "Co-authored-by: Da0nn <166224732+CatIsApple@users.noreply.github.com>"
          git push origin achievement/pair-extraordinaire
