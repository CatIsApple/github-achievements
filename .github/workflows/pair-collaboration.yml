name: Create co-authored collaboration branches

on:
  workflow_dispatch:
    inputs:
      start:
        description: First collaboration record number
        required: true
        type: number
      end:
        description: Last collaboration record number
        required: true
        type: number

permissions:
  contents: write

jobs:
  create-collaboration-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create truthful bot-authored collaboration records
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base_sha="$GITHUB_SHA"
          for number in $(seq "${{ inputs.start }}" "${{ inputs.end }}"); do
            record_id=$(printf '%03d' "$number")
            branch="achievement/pair-${record_id}"
            path="records/pair-${record_id}.md"
            git switch --detach "$base_sha"
            git switch -C "$branch"
            mkdir -p records
            printf '%s\n' \
              "# Collaboration record ${record_id}" \
              '' \
              'GitHub Actions generated this unique record with the repository owner.' \
              'The resulting commit documents transparent automation and co-authorship.' \
              > "$path"
            git add "$path"
            git commit -m "docs: add collaboration record ${record_id}" \
              -m "Co-authored-by: Da0nn <166224732+CatIsApple@users.noreply.github.com>"
            git push origin "$branch"
          done
